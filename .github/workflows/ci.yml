name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Resolve workspace
        run: flutter pub get --enforce-lockfile
      - name: Check generated code is up to date
        run: tool/check_generated.sh
      - name: Check that no encryption crept back in (ADR 0034)
        run: tool/check_no_encryption.sh
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (zero warnings, zero infos)
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Test all packages (goldens run on macOS)
        run: tool/test_all.sh
        env:
          FLUTTER_TEST_ARGS: --exclude-tags golden
      - name: Report outdated dependencies
        run: flutter pub outdated --no-dev-dependencies || true
