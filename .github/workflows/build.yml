name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build APK (debug, unsigned)
        working-directory: app
        run: flutter build apk --debug

  apple:
    name: iOS, macOS and goldens
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Golden tests (rendered on macOS)
        working-directory: app
        run: flutter test --tags golden
      - name: Build iOS (no codesign)
        working-directory: app
        run: flutter build ios --no-codesign --debug
      - name: Build macOS
        working-directory: app
        run: flutter build macos --debug
      - name: End-to-end test on macOS against the mock Wavelog
        run: |
          (cd packages/wavelog_mock && dart run bin/serve.dart 8765 > "$RUNNER_TEMP/mock.log" 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/index.php/api/v2/status && break
            sleep 1
          done
          cd app && flutter test integration_test -d macos
      - name: Mock server log
        if: always()
        run: cat "$RUNNER_TEMP/mock.log" || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Data-layer tests on Windows (encryption, DPAPI-independent)
        working-directory: packages/tideline_data
        run: dart test
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Package MSIX (unsigned test package)
        working-directory: app
        run: dart run msix:create --build-windows false --install-certificate false

  linux:
    name: Linux (unofficial)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter build linux --debug
