# Builds signed release artifacts when a version tag (v*) is pushed.
#
# Signing material comes ONLY from repository secrets; see
# docs/release.md for the list. Jobs whose secrets are missing build
# unsigned artifacts and say so, so the workflow can be tried before the
# credentials exist. Store uploads are not automated yet (docs/release.md).
#
# On a tag push the last job creates the GitHub release with the Windows and
# Linux downloads, the SBOM and checksums. workflow_dispatch builds everything
# but publishes nothing (a dry run).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version and check it against the tag
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          [ -n "$version" ] || { echo "::error::No version in app/pubspec.yaml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Write signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - building unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > app/android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - name: Build app bundle
        working-directory: app
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: app/build/app/outputs/bundle/release/*.aab

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Import signing certificate into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::warning::APPLE_CERT_P12_BASE64 not set - building unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build iOS
        working-directory: app
        env:
          SIGNED: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            flutter build ipa --release
          else
            flutter build ios --release --no-codesign
          fi
      - name: Build macOS
        working-directory: app
        run: flutter build macos --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple
          path: |
            app/build/ios/ipa/*.ipa
            app/build/macos/Build/Products/Release/*.app
          if-no-files-found: warn

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Package the portable zip
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $name = "Tideline-$env:VERSION-windows-x64-portable"
          $release = "app/build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "$release/*" $name -Recurse
          # App-local copy of the Visual C++ runtime, so the zip runs on a
          # machine without the redistributable installed.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            if (Test-Path "$env:SystemRoot/System32/$dll") {
              Copy-Item "$env:SystemRoot/System32/$dll" $name
            } else {
              Write-Warning "$dll not found on the runner; not bundled."
            }
          }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package signed MSIX
        working-directory: app
        shell: bash
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
        run: |
          if [ -z "$PFX_BASE64" ]; then
            echo "::warning::WINDOWS_CERT_PFX_BASE64 not set - packaging unsigned."
            dart run msix:create --build-windows false --install-certificate false
            exit 0
          fi
          echo "$PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          dart run msix:create --build-windows false --install-certificate false \
            --certificate-path "$RUNNER_TEMP/cert.pfx" \
            --certificate-password "$PFX_PASSWORD" \
            --publisher "$PUBLISHER"
          rm "$RUNNER_TEMP/cert.pfx"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msix
          path: app/build/windows/x64/runner/Release/*.msix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable
          path: Tideline-*-windows-x64-portable.zip

  linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux
        working-directory: app
        run: flutter build linux --release
      - name: Package the tarball
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          name="Tideline-$VERSION-linux-x64"
          tar -C app/build/linux/x64/release --transform "s,^bundle,$name," -czf "$name.tar.gz" bundle
          tar -tzf "$name.tar.gz" | head -5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-tarball
          path: Tideline-*-linux-x64.tar.gz

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM (SPDX) from the lockfile
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: tideline-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: tideline-sbom.spdx.json

  publish:
    # Only for a tag push; workflow_dispatch is a dry run.
    if: github.ref_type == 'tag'
    needs: [meta, android, apple, windows, linux, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "{windows-msix,windows-portable,linux-tarball,sbom}"
          merge-multiple: true
      - name: Name the files, add checksums and write the notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir release
          cp artifacts/Tideline-*-windows-x64-portable.zip artifacts/Tideline-*-linux-x64.tar.gz release/
          msix="$(find artifacts -maxdepth 1 -name '*.msix')"
          [ "$(echo "$msix" | wc -l)" = 1 ] && [ -n "$msix" ] || { echo "::error::Expected exactly one MSIX"; exit 1; }
          cp "$msix" "release/Tideline-$VERSION-windows-x64.msix"
          cp artifacts/tideline-sbom.spdx.json "release/Tideline-$VERSION-sbom.spdx.json"
          (cd release && sha256sum * > SHA256SUMS.txt)
          # The CHANGELOG section of this version, then the install notes.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No CHANGELOG.md section for $VERSION"; exit 1; }
          cat .github/release-notes-footer.md >> notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in 0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$TAG" release/* --verify-tag $flags \
            --title "Tideline $VERSION" --notes-file notes.md
