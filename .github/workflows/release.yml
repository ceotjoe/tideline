# Builds signed release artifacts when a version tag (v*) is pushed.
#
# Signing material comes ONLY from repository secrets; see docs/release.md for
# the list. Outside a tag run, jobs whose secrets are missing build unsigned
# artifacts and say so, so the workflow can be tried before the credentials
# exist. Credentials that publish live in the `production` environment and are
# visible only to the upload jobs.
#
# On a tag push the publish job creates the GitHub release with the Windows and
# Linux downloads, the SBOM and checksums, and the play job uploads the AAB to
# the internal track of Google Play and the testflight job uploads the IPA to
# App Store Connect (ADR 0030). The macOS upload is not automated yet.
# workflow_dispatch builds everything and publishes nothing
# (a dry run).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the version and check it against the tag
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          [ -n "$version" ] || { echo "::error::No version in app/pubspec.yaml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Write signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # A release must never go out debug-signed; Play would refuse it anyway.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 not set - refusing to build a release unsigned."
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - building unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > app/android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - name: Build app bundle
        working-directory: app
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: app/build/app/outputs/bundle/release/*.aab

  ios:
    name: iOS and iPadOS
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Import signing certificate and profile
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            # A release must never be built unsigned (nothing could be uploaded).
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::APPLE_CERT_P12_BASE64 or IOS_PROVISIONING_PROFILE_BASE64 not set - refusing to build a release unsigned."
              exit 1
            fi
            echo "::warning::Apple signing secrets not set - building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build the signed IPA
        if: steps.signing.outputs.signed == 'true'
        run: tool/ios_archive.sh --profile "$RUNNER_TEMP/profile.mobileprovision"
      - name: Build iOS unsigned (no signing secrets, not a release)
        if: steps.signing.outputs.signed != 'true'
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Remove the temporary keychain and profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ipa
          path: app/build/ios/export/*.ipa
          if-no-files-found: warn

  macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      # Unsigned: the Mac App Store build is made locally with
      # tool/macos_archive.sh until it is automated (docs/release.md).
      - name: Build macOS
        working-directory: app
        run: flutter build macos --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: app/build/macos/Build/Products/Release/*.app
          if-no-files-found: warn

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Package the portable zip
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $name = "Tideline-$env:VERSION-windows-x64-portable"
          $release = "app/build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "$release/*" $name -Recurse
          # App-local copy of the Visual C++ runtime, so the zip runs on a
          # machine without the redistributable installed.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            if (Test-Path "$env:SystemRoot/System32/$dll") {
              Copy-Item "$env:SystemRoot/System32/$dll" $name
            } else {
              Write-Warning "$dll not found on the runner; not bundled."
            }
          }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package signed MSIX
        working-directory: app
        shell: bash
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
        run: |
          if [ -z "$PFX_BASE64" ]; then
            echo "::warning::WINDOWS_CERT_PFX_BASE64 not set - packaging unsigned."
            dart run msix:create --build-windows false --install-certificate false
            exit 0
          fi
          echo "$PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          dart run msix:create --build-windows false --install-certificate false \
            --certificate-path "$RUNNER_TEMP/cert.pfx" \
            --certificate-password "$PFX_PASSWORD" \
            --publisher "$PUBLISHER"
          rm "$RUNNER_TEMP/cert.pfx"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msix
          path: app/build/windows/x64/runner/Release/*.msix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable
          path: Tideline-*-windows-x64-portable.zip

  linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux
        working-directory: app
        run: flutter build linux --release
      - name: Package the tarball
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          name="Tideline-$VERSION-linux-x64"
          tar -C app/build/linux/x64/release --transform "s,^bundle,$name," -czf "$name.tar.gz" bundle
          tar -tzf "$name.tar.gz" | head -5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-tarball
          path: Tideline-*-linux-x64.tar.gz

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM (SPDX) from the lockfile
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: tideline-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: tideline-sbom.spdx.json

  publish:
    # Only for a tag push; workflow_dispatch is a dry run.
    if: github.ref_type == 'tag'
    needs: [meta, android, ios, macos, windows, linux, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "{windows-msix,windows-portable,linux-tarball,sbom}"
          merge-multiple: true
      - name: Name the files, add checksums and write the notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir release
          cp artifacts/Tideline-*-windows-x64-portable.zip artifacts/Tideline-*-linux-x64.tar.gz release/
          msix="$(find artifacts -maxdepth 1 -name '*.msix')"
          [ "$(echo "$msix" | wc -l)" = 1 ] && [ -n "$msix" ] || { echo "::error::Expected exactly one MSIX"; exit 1; }
          cp "$msix" "release/Tideline-$VERSION-windows-x64.msix"
          cp artifacts/tideline-sbom.spdx.json "release/Tideline-$VERSION-sbom.spdx.json"
          (cd release && sha256sum * > SHA256SUMS.txt)
          # The CHANGELOG section of this version, then the install notes.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No CHANGELOG.md section for $VERSION"; exit 1; }
          cat .github/release-notes-footer.md >> notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in 0.*|*-*) flags="--prerelease" ;; esac
          gh release create "$TAG" release/* --verify-tag $flags \
            --title "Tideline $VERSION" --notes-file notes.md

  play:
    name: Google Play (internal track)
    # Only for a tag push; workflow_dispatch is a dry run. The environment
    # holds PLAY_SERVICE_ACCOUNT_JSON and asks the maintainer for approval.
    if: github.ref_type == 'tag'
    needs: [meta, android]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-aab
          path: aab
      - name: Refuse a bundle that is not signed with the upload key
        run: |
          aab="$(find aab -name '*.aab')"
          [ "$(echo "$aab" | wc -l)" = 1 ] && [ -n "$aab" ] || { echo "::error::Expected exactly one AAB"; exit 1; }
          certs="$(keytool -printcert -jarfile "$aab")"
          if [ -z "$certs" ] || echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The AAB is unsigned or debug-signed; Play would refuse it."
            exit 1
          fi
      # Internal track only; promotion to closed testing and production is
      # done by hand in Play Console. Until the app has a published release the
      # API accepts only drafts: set the repository variable
      # PLAY_RELEASE_STATUS to "completed" after the first manual rollout.
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ITWebService.tideline
          releaseFiles: aab/*.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          releaseName: ${{ needs.meta.outputs.version }}

  testflight:
    name: TestFlight (iOS and iPadOS)
    # Only for a tag push; workflow_dispatch is a dry run. The environment
    # holds the App Store Connect API key and asks the maintainer for approval.
    if: github.ref_type == 'tag'
    needs: [meta, ios]
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-ipa
          path: ipa
      - name: Upload to App Store Connect
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa="$(find ipa -name '*.ipa')"
          [ "$(echo "$ipa" | wc -l)" = 1 ] && [ -n "$ipa" ] || { echo "::error::Expected exactly one IPA"; exit 1; }
          # altool looks for the key in this folder, named after its id.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          trap 'rm -f "$key"' EXIT
          xcrun altool --upload-app --type ios -f "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
