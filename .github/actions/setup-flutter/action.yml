name: Set up Flutter (cached)
description: >
  Installs the pinned Flutter version with SDK and pub caches.
  flutter-action's built-in cache uses actions/cache by tag, which the
  repository's "require SHA pinning" policy rejects, so caching is done
  here with a SHA-pinned actions/cache instead.
inputs:
  flutter-version:
    description: Flutter version to install.
    required: true
runs:
  using: composite
  steps:
    - name: Compute Flutter cache paths
      id: paths
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        dry-run: true
    - name: Cache Flutter SDK
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.CACHE-PATH }}
        key: ${{ steps.paths.outputs.CACHE-KEY }}
    - name: Cache pub packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.paths.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
    - name: Install Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
