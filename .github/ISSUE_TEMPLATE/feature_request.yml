name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "During a SOTA activation I can't …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Tideline to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
  - type: checkboxes
    id: offline
    attributes:
      label: Fit with Tideline's principles
      options:
        - label: This should also work without an internet connection.
        - label: This needs a connection to Wavelog or another service.
