name: tideline
description: "Tideline — the offline logger for Wavelog."
publish_to: none

version: 0.5.0+7

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  tideline_adif:
    path: ../packages/tideline_adif
  tideline_data:
    path: ../packages/tideline_data
  tideline_domain:
    path: ../packages/tideline_domain
  wakelock_plus: ^1.8.1
  wavelog_client:
    path: ../packages/wavelog_client
  # Serves the in-app demo account without a network (ADR 0031).
  wavelog_mock:
    path: ../packages/wavelog_mock

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  msix: ^3.18.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # AD1C country files (MIT-style licence in cty-LICENSE.txt), ADR 0013.
    - assets/reference/
    # Bundled contest definitions (data, not code), ADR 0018.
    - assets/contests/
  fonts:
    # Optional reading font (SIL OFL 1.1, assets/fonts/), ADR 0016.
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic

# Windows packaging (dart run msix:create). Signing certificate and
# publisher are supplied by the release workflow from CI secrets.
msix_config:
  display_name: Tideline
  publisher_display_name: Jörg Holzapfel (DO1HOZ)
  identity_name: com.ITWebService.tideline
  msix_version: 0.5.0.0
  # Wavelog on the internet and on the local network.
  capabilities: internetClient,privateNetworkClientServer
  store: false
  logo_path: assets/icon/msix_logo.png
