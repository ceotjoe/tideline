name: tideline
description: "Tideline — the offline logger for Wavelog."
publish_to: none

version: 0.0.1+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  path_provider: ^2.1.6
  tideline_data:
    path: ../packages/tideline_data
  tideline_domain:
    path: ../packages/tideline_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
