name: tideline_workspace
description: Workspace root for Tideline — the offline logger for Wavelog.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/tideline_domain
  - packages/tideline_adif
  - packages/wavelog_client
  - packages/tideline_data
  - packages/wavelog_mock

dev_dependencies:
  very_good_analysis: ^11.0.0

# Native SQLite build used by package:sqlite3 (drift): plain SQLite, no
# encryption of our own — see docs/adr/0034-remove-app-level-encryption.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3
