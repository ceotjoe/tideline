name: tideline_workspace
description: Workspace root for Tideline — the offline logger for Wavelog.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/tideline_domain
  - packages/tideline_adif
  - packages/wavelog_client
  - packages/tideline_data
  - packages/wavelog_mock

dev_dependencies:
  very_good_analysis: ^11.0.0

# Native SQLite build used by package:sqlite3 (drift). SQLite3MultipleCiphers
# provides encryption at rest — see docs/adr/0005-encrypted-database-sqlite3mc.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
